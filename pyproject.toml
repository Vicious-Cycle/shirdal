[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[project]
name = "shirdal"
version = "1.0.12"
description = "A fast, transport-agnostic, context-first Python framework for Telegram Bot API 10.5 and native MTProto 2.0."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "LGPL-3.0-or-later" }
authors = [{ name = "Vicious-Cycle" }]
keywords = ["telegram", "bot", "bot-api", "mtproto", "asyncio", "framework"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: AsyncIO",
]
dependencies = ["cryptography>=42.0.0"]

[project.urls]
Homepage = "https://github.com/Vicious-Cycle/shirdal"
Repository = "https://github.com/Vicious-Cycle/shirdal"
Issues = "https://github.com/Vicious-Cycle/shirdal/issues"

[project.scripts]
shirdal = "shirdal.cli:main"

[project.optional-dependencies]
fast = [
    "uvloop>=0.19.0; sys_platform != 'win32'",
    "msgspec>=0.18.6",
    "shircrypt>=1.0.3",
]
telethon = ["telethon>=1.36.0"]
hydrogram = ["hydrogram>=0.2.0"]
redis = ["redis>=5.0.0"]
mysql = ["aiomysql>=0.2.0"]
crypto = ["cryptography>=42.0.0"]
shircrypt = ["shircrypt>=1.0.3"]
all = [
    "uvloop>=0.19.0; sys_platform != 'win32'",
    "msgspec>=0.18.6",
    "telethon>=1.36.0",
    "hydrogram>=0.2.0",
    "redis>=5.0.0",
    "aiomysql>=0.2.0",
    "cryptography>=42.0.0",
    "shircrypt>=1.0.3",
]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "ruff>=0.4.0", "mypy>=1.10.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/shirdal"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
