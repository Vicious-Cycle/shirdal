site_name: Shirdal
site_description: A fast, context-first Python framework for Telegram Bot API and MTProto clients.
repo_url: https://github.com/Vicious-Cycle/shirdal
repo_name: Vicious-Cycle/shirdal

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top

nav:
  - Home: getting-started.md
  - Bot API Features: bot-api.md
  - Rich Messages: rich-messages.md
  - Webhook & Deployment: webhook-and-deployment.md
  - فارسی: fa/README.md
